<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="icon" href="./img/group.png?v=2" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <img src="./img/group.png" alt="Fotogram Logo" class="header_logo">
        <h1>Fotogram</h1>
    </header>
     <main class="main">
        <div class="headline">
            <h2>Your personal Meme Gallery</h2>
        </div>
        <div class="gallery">
            <section id="firstSection" class="first_row"> <!-- First Row Content --></section>
            <section id="secondSection" class="second_row"> <!-- Second Row Content --></section>
        </div>

        <div id="dialogContainer">
            <!-- Dialoge werden hier dynamisch eingefügt -->
        </div>
     </main>
     <footer class="footer">
        <img src="./img/Icon.png" alt="Fotogram Logo" class="footer_logo">
        <p>&copy; 2026 Fotogram. All rights reserved.</p>
     </footer>
     <script src="script.js"></script>
</body>
</html>
