<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body onload="render()">
    <header class="header">
        <img src="./img/group.png" alt="Fotogram Logo" class="header_logo">
        <h1>Fotogram</h1>
    </header>
     <main class="main">
        <div class="headline">
            <h2>Random pictures of everything</h2>
        </div>
        <div class="gallery">
            <section class="first_row">
                <button class="img-button" tabindex="0" onclick="openDialog('dialog1')"><img src="./img/12019-hurricane-92968.jpg" alt="Hurricane" aria-haspopup="dialog"></button>
                <button class="img-button" tabindex="0" onclick="openDialog('dialog2')"><img src="./img/chikilino-turtle-5568624_1920.jpg" alt="Turtle" aria-haspopup="dialog"></button>
                <button class="img-button" tabindex="0" onclick="openDialog('dialog3')"><img src="./img/corgaasbeek-lamb-3341618_1920.jpg" alt="Lamb" aria-haspopup="dialog"></button>
                <button class="img-button" tabindex="0" onclick="openDialog('dialog4')"><img src="./img/kanenori-lake-7938396.jpg" alt="Lake" aria-haspopup="dialog"></button>
                <button class="img-button" tabindex="0" onclick="openDialog('dialog5')"><img src="./img/kanenori-landscape-7534634.jpg" alt="Landscape" aria-haspopup="dialog"></button>
                <button class="img-button" tabindex="0" onclick="openDialog('dialog6')"><img src="./img/kanenori-trail-8117575.jpg" alt="Trail" aria-haspopup="dialog"></button>
                <button class="img-button" tabindex="0" onclick="openDialog('dialog7')"><img src="./img/leolevng-castle-5476737.jpg" alt="Castle" aria-haspopup="dialog"></button>
            </section>
            <section class="second_row">
                <button class="img-button" tabindex="0" onclick="openDialog('dialog8')"><img src="./img/kanenori-rainforest-4350845.jpg" alt="Rainforest" aria-haspopup="dialog"></button>
                <button class="img-button" tabindex="0" onclick="openDialog('dialog9')"><img src="./img/marucha-dubai-3188864_1920.jpg" alt="Dubai" aria-haspopup="dialog"></button>
                <button class="img-button" tabindex="0" onclick="openDialog('dialog10')"><img src="./img/raniramli-ai-generated-8498983.png" alt="AI Generated" aria-haspopup="dialog"></button>
                <button class="img-button" tabindex="0" onclick="openDialog('dialog11')"><img src="./img/rperucho-building-10122862_1920.jpg" alt="Building" aria-haspopup="dialog"></button>
                <button class="img-button" tabindex="0" onclick="openDialog('dialog12')"><img src="./img/wikiimages-hurricane-benilde-58071.jpg" alt="Hurricane" aria-haspopup="dialog "></button>
            </section>      
        </div>

        <div id="dialogContainer">
            <!-- Dialoge werden hier dynamisch eingefügt -->
        </div>
     </main>
     <footer class="footer">
        <img src="./img/Icon.png" alt="Fotogram Logo" class="footer_logo">
        <p>&copy; 2026 Fotogram. All rights reserved.</p>
     </footer>
     <script src="script.js"></script>
</body>
</html>
