<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="script" src="script.js">
</head>
<body onload="render()">

        <h1><img src="" alt="">Fotogram</h1>
    </header>

    <main>
        <div class="gallery">
            <h2>Your personal photo album</h2>
            <section class="up_line">
                <img src="img/kanenori-lake-7938396.jpg" alt="lake" onclick="openDialog(photoDialog_lake)">
                <img src="img/kanenori-trail-8117575.jpg" alt="trail" onclick="openDialog(photoDialog_trail)">
                <img src="img/leolevng-castle-5476737.jpg" alt="castle" onclick="openDialog(photoDialog_castle)">
                <img src="img/raniramli-ai-generated-8498983.png" alt="ai-generated" onclick="openDialog(photoDialog_ai_generated)">
                <img src="img/12019-hurricane-92968.jpg" alt="hurricane" onclick="openDialog(photoDialog_hurricane)">
                <img src="img/chikilino-turtle-5568624_1920.jpg" alt="turtle" onclick="openDialog(photoDialog_turtle)">
                <img src="img/corgaasbeek-lamb-3341618_1920.jpg" alt="lamb" onclick="openDialog(photoDialog_lamb)">
            </section>
            <section class="down_line">
                <img src="img/marucha-dubai-3188864_1920.jpg" alt="dubai" onclick="openDialog(photoDialog_dubai)">
                <img src="img/rperucho-building-10122862_1920.jpg" alt="building" onclick="openDialog(photoDialog_building)">
                <img src="img/kanenori-landscape-7534634.jpg" alt="landscape" onclick="openDialog(photoDialog_landscape)">
                <img src="img/wikiimages-hurricane-benilde-58071.jpg" alt="storm" onclick="openDialog(photoDialog_storm)">
                <img src="img/kanenori-rainforest-4350845.jpg" alt="rainforest" onclick="openDialog(photoDialog_rainforest)">
            </section>
            <dialog class="galleryDialog" id="photoDialog_lake">
                <header class="dialog-header">
                    <h3></h3>
                    <button class="close-btn" onclick="closeDialog()">X</button>
                </header>
                <main>
                   <div id="content">
                    <img src="img/kanenori-lake-7938396.jpg" alt="lake" class="photoImage">
                   </div>
                </main>
                <footer>
                    <button class="arrow">&larr;</button>
                    <p id="number">1/12</p>
                    <button class="arrow">&#8594;</button>
                </footer>
                <script src="script.js"></script>
            </dialog>
