<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="render()">
    <header>
        <h1>Fotogram</h1>
    </header>
     <main>
        <div class="headline">
            <h2>Your personal photo album</h2>
        </div>
        <div class="gallery">
            <section class="first_row">
                <img src="./img/12019-hurricane-92968.jpg" alt="Hurricane" onclick="openDialog()">
                <img src="./img/chikilino-turtle-5568624_1920.jpg" alt="Turtle">
                <img src="./img/corgaasbeek-lamb-3341618_1920.jpg" alt="Lamb">
                <img src="./img/kanenori-lake-7938396.jpg" alt="Lake">
                <img src="./img/kanenori-landscape-7534634.jpg" alt="Landscape">
                <img src="./img/kanenori-trail-8117575.jpg" alt="Trail">
                <img src="./img/leolevng-castle-5476737.jpg" alt="Castle">
            </section>
            <section class="second_row">
                <img src="./img/kanenori-rainforest-4350845.jpg" alt="Rainforest">
                <img src="./img/marucha-dubai-3188864_1920.jpg" alt="Dubai">
                <img src="./img/raniramli-ai-generated-8498983.png" alt="AI Generated">
                <img src="./img/rperucho-building-10122862_1920.jpg" alt="Building">
                <img src="./img/wikiimages-hurricane-benilde-58071.jpg" alt="Hurricane">
            </section>
            <dialog class="modal" id="photoDialog">
                <header class="dialog_header" id="dialogHeader">
                    <h3>12019-hurricane-92968.jpg</h3>
                    <button id="closeDialog" onclick="closeDialog()">X</button>
                </header>
                <main class="dialog_main">
                    <img src="./img/12019-hurricane-92968.jpg" alt="Hurricane">
                </main>
                <footer class="dialog_footer">

                </footer>
                
            </dialog>
        </div>
     </main>
     <footer>
        <img src="./img/Icon.png" alt="Fotogram Logo" class="footer_logo">
        <p>&copy; 2026 Fotogram. All rights reserved.</p>
     </footer>
     <script src="script.js"></script>
</body>
</html>
