<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="render()">
    <header>
        <h1>Fotogram</h1>
    </header>
     <main>
        <div class="headline">
            <h2>Your personal photo album</h2>
        </div>
        <div class="gallery">
            <section class="first_row">
                <img src="./img/12019-hurricane-92968.jpg" alt="Hurricane" onclick="openDialog('dialog1')">
                <img src="./img/chikilino-turtle-5568624_1920.jpg" alt="Turtle" onclick="openDialog('dialog2')">
                <img src="./img/corgaasbeek-lamb-3341618_1920.jpg" alt="Lamb" onclick="openDialog('dialog3')">
                <img src="./img/kanenori-lake-7938396.jpg" alt="Lake" onclick="openDialog('dialog4')">
                <img src="./img/kanenori-landscape-7534634.jpg" alt="Landscape" onclick="openDialog('dialog5')">
                <img src="./img/kanenori-trail-8117575.jpg" alt="Trail" onclick="openDialog('dialog6')">
                <img src="./img/leolevng-castle-5476737.jpg" alt="Castle" onclick="openDialog('dialog7')">
            </section>
            <section class="second_row">
                <img src="./img/kanenori-rainforest-4350845.jpg" alt="Rainforest" onclick="openDialog('dialog8')">
                <img src="./img/marucha-dubai-3188864_1920.jpg" alt="Dubai" onclick="openDialog('dialog9')">
                <img src="./img/raniramli-ai-generated-8498983.png" alt="AI Generated" onclick="openDialog('dialog10')">
                <img src="./img/rperucho-building-10122862_1920.jpg" alt="Building" onclick="openDialog('dialog11')">
                <img src="./img/wikiimages-hurricane-benilde-58071.jpg" alt="Hurricane" onclick="openDialog('dialog12')">
            </section>           
        </div>

        <div id="dialogContainer">
            <!-- Dialoge werden hier dynamisch eingefügt -->
        </div>
     </main>
     <footer>
        <img src="./img/Icon.png" alt="Fotogram Logo" class="footer_logo">
        <p>&copy; 2026 Fotogram. All rights reserved.</p>
     </footer>
     <script src="script.js"></script>
</body>
</html>
