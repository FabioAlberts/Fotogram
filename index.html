<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="script" src="script.js"></link>
</head>
<body>
    <header>
        <h1><img src="" alt="">Fotogram</h1>
    </header>

    <main>
        <div class="gallery">
            <h2>Your personal photo album</h2>
            <section class="up_line" onclick="openDialog(photoDialog)">
                <img src="img/kanenori-lake-7938396.jpg" alt="lake">
                <img src="img/kanenori-trail-8117575.jpg" alt="trail">
                <img src="img/leolevng-castle-5476737.jpg" alt="castle">
                <img src="img/raniramli-ai-generated-8498983.png" alt="ai-generated">
                <img src="img/12019-hurricane-92968.jpg" alt="hurricane">
                <img src="img/chikilino-turtle-5568624_1920.jpg" alt="turtle">
                <img src="img/corgaasbeek-lamb-3341618_1920.jpg" alt="lamb">
            </section>
            <section class="down_line" onclick="openDialog(photoDialog)">
                <img src="img/marucha-dubai-3188864_1920.jpg" alt="dubai">
                <img src="img/rperucho-building-10122862_1920.jpg" alt="building">
                <img src="img/kanenori-landscape-7534634.jpg" alt="landscape">
                <img src="img/wikiimages-hurricane-benilde-58071.jpg" alt="storm">
                <img src="img/kanenori-rainforest-4350845.jpg" alt="rainforest">
            </section>
            <dialog class="galleryDialog" id="photoDialog">
                <header class="dialog-header">
                    <h3>Photo Title</h3>
                    <button class="close-btn" onclick="closeDialog()">X</button>
                </header>
                <main>
                   
                </main>
                <footer>
                    <button class="arrow">&larr;</button>
                    <p></p>
                    <button class="arrow">&#8594;</button>
                </footer>
                <script src="script.js"></script>
            </dialog>
        </div>
    </main>

    <footer>
        <div class="academy">
        <img src="img/Icon.png" alt="DA-Logo">
        <section class="copyright">
        <h6>Developer Academy</h6>
        <p> © 2024 Developer Academy. All rights reserved.</p>
        </section>
        </div>
    </footer>
</body>
</html>
